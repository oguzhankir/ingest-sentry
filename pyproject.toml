[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ingest-sentry"
version = "0.1.0"
description = "Offline CSV and TSV import diagnostics powered by bytesense."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Oğuzhan Kır" }]
dependencies = ["bytesense>=1.1.0,<2"]
keywords = ["csv", "tsv", "encoding", "validation", "data-import", "bytesense"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing",
  "Topic :: Utilities",
  "Typing :: Typed",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
  "mypy>=1.14",
  "build>=1.2",
  "twine>=6",
]

[project.scripts]
ingest-sentry = "ingest_sentry.cli:main"

[project.urls]
Repository = "https://github.com/oguzhankir/ingest-sentry"
Issues = "https://github.com/oguzhankir/ingest-sentry/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ingest_sentry = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.coverage.run]
source = ["ingest_sentry"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
