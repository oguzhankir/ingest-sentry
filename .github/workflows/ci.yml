name: CI

on:
  push:
    branches: [main, 'oguzhankir/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }} / ${{ matrix.backend }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.10', backend: pure}
          - {os: ubuntu-latest, python: '3.12', backend: pure}
          - {os: ubuntu-latest, python: '3.14', backend: pure}
          - {os: windows-latest, python: '3.12', backend: pure}
          - {os: macos-latest, python: '3.12', backend: pure}
          - {os: ubuntu-latest, python: '3.12', backend: native}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install pure-Python bytesense from source
        if: matrix.backend == 'pure'
        env:
          BYTESENSE_BUILD_RUST: '0'
        run: python -m pip install --no-cache-dir --no-binary=bytesense 'bytesense==1.1.0'
      - name: Install native bytesense wheel
        if: matrix.backend == 'native'
        run: python -m pip install --only-binary=:all: 'bytesense==1.1.0'
      - name: Verify backend
        env:
          EXPECT_NATIVE: ${{ matrix.backend == 'native' && '1' || '0' }}
        run: python -c "import os; from bytesense._rust import is_rust_available; assert is_rust_available() == (os.environ['EXPECT_NATIVE'] == '1')"
      - run: python -m pip install . pytest
      - run: python -m pytest tests
      - run: ingest-sentry --version

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src/ingest_sentry
      - run: python -m pytest tests --cov=ingest_sentry --cov-branch --cov-report=term-missing --cov-report=xml
      - run: python -m build
      - run: python scripts/check_dist.py dist
      - run: python -m twine check --strict dist/*
      - name: Test wheel installation
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          python -m pytest tests
          ingest-sentry --version
      - name: Test source distribution installation
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.tar.gz
          python -m pytest tests
      - uses: actions/upload-artifact@v4
        with:
          name: distribution-and-coverage
          path: |
            dist/*
            coverage.xml
