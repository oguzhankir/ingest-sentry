name: Reusable action

on:
  push:
    branches: [main, 'oguzhankir/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: action-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    name: Local action / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Accept a valid import contract
        id: clean
        uses: ./
        with:
          path: examples/vendor_export.csv
          contract: examples/vendor.contract.json
      - name: Reject broken record structure
        id: broken
        continue-on-error: true
        uses: ./
        with:
          path: examples/vendor_export_broken.csv
          encoding: utf-8
          delimiter: ';'
      - name: Create a synthetic contract violation
        shell: python
        run: |
          from pathlib import Path
          Path("contract_mismatch.csv").write_text(
              "id;description;amount\n1;PRIVATE_CELL_SENTINEL;not-a-number\n",
              encoding="utf-8",
          )
      - name: Reject a schema type mismatch
        id: mismatch
        continue-on-error: true
        uses: ./
        with:
          path: contract_mismatch.csv
          contract: examples/vendor.contract.json
      - name: Verify outcomes and content-redacted reports
        if: always()
        shell: python
        env:
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          CLEAN_OK: ${{ steps.clean.outputs.ok }}
          CLEAN_REPORT: ${{ steps.clean.outputs.report-path }}
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
          BROKEN_OK: ${{ steps.broken.outputs.ok }}
          BROKEN_REPORT: ${{ steps.broken.outputs.report-path }}
          MISMATCH_OUTCOME: ${{ steps.mismatch.outcome }}
          MISMATCH_OK: ${{ steps.mismatch.outputs.ok }}
          MISMATCH_REPORT: ${{ steps.mismatch.outputs.report-path }}
        run: |
          import json
          import os
          import stat
          from pathlib import Path

          temporary = Path(os.environ["RUNNER_TEMP"]).resolve()
          for name, accepted in (("CLEAN", True), ("BROKEN", False), ("MISMATCH", False)):
              assert os.environ[name + "_OUTCOME"] == ("success" if accepted else "failure")
              assert os.environ[name + "_OK"] == str(accepted).lower()
              target = Path(os.environ[name + "_REPORT"]).resolve(strict=True)
              assert target.is_relative_to(temporary)
              if os.name != "nt":
                  assert stat.S_IMODE(target.stat().st_mode) == 0o600
              text = target.read_text(encoding="utf-8")
              report = json.loads(text)
              assert report["action_passed"] is accepted
              assert report["complete"] is True
              assert "PRIVATE_CELL_SENTINEL" not in text
              assert "not-a-number" not in text
              assert "Engineering services" not in text
              if name == "MISMATCH":
                  assert any(issue["code"] == "contract_type" for issue in report["issues"])
          print("All action outcomes and private report checks passed.")
